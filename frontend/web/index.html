    :root { --bg: #FAF8F5; --ink: #0F172A; --gold: #C59B27; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: Georgia, 'Times New Roman', serif; color: var(--ink);
      transition: opacity .3s ease;

    #splash .crest {
      width: 56px; height: 56px; border-radius: 50%; background: #0F172A;
      border: 1.5px solid var(--gold); color: #E2BE5A; display: grid; place-items: center;
      font-weight: 700; letter-spacing: .5px;
    }
    #splash .bar { width: 120px; height: 2px; background: rgba(197,155,39,.2); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--gold);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
